port: /dev/ttyACM0

joint_order: [joint1, joint2, joint3, joint4, joint5, joint_gripper]
sleep_positions: [0, 0, 0, 0, 0, 0]

joint_state_publisher:
  update_rate: 20
  publish_states: true
  topic_name: joint_states

groups:
  arm: [joint1, joint2, joint3, joint4, joint5]
  gripper: [joint_gripper]

grippers:
  gripper:
    horn_radius: 0.014
    arm_length: 0.024
    left_finger: joint_gripper
    right_finger: joint_gripper

shadows:

sisters:

motors:
  joint1:
    ID: 1
    Baud_Rate: 3
    Return_Delay_Time: 0
    Drive_Mode: 0
    Velocity_Limit: 131
    Min_Position_Limit: 0        # 0-4095, 2048=0rad, 0=-π, 4095=π
    Max_Position_Limit: 4095
    Secondary_ID: 255

